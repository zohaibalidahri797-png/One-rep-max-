<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171f" />
      <stop offset="100%" stop-color="#0a0b0d" />
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
  </defs>

  <!-- Dark Rounded App Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#22c55e" stroke-opacity="0.25" stroke-width="8" />

  <!-- Barbell Bar -->
  <rect x="40" y="242" width="432" height="28" rx="14" fill="#334155" />
  <rect x="140" y="244" width="232" height="24" rx="6" fill="#64748b" />

  <!-- Left Olympic Plates -->
  <rect x="64" y="146" width="28" height="220" rx="10" fill="url(#greenGrad)" />
  <rect x="100" y="176" width="24" height="160" rx="8" fill="#22c55e" />
  <rect x="132" y="210" width="16" height="92" rx="6" fill="#15803d" />

  <!-- Right Olympic Plates -->
  <rect x="420" y="146" width="28" height="220" rx="10" fill="url(#greenGrad)" />
  <rect x="388" y="176" width="24" height="160" rx="8" fill="#22c55e" />
  <rect x="364" y="210" width="16" height="92" rx="6" fill="#15803d" />

  <!-- Center 1RM Badge Shield -->
  <rect x="176" y="156" width="160" height="200" rx="24" fill="#0d1017" stroke="#22c55e" stroke-width="6" />

  <!-- Geometric "1RM" Mark (Clean Vector Paths) -->
  <!-- "1" -->
  <path d="M214 200 L230 186 L230 274 L210 274 M216 274 L244 274" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- "R" -->
  <path d="M256 274 L256 218 L278 218 C288 218 294 224 294 232 C294 240 288 246 278 246 L256 246 M274 246 L294 274" fill="none" stroke="url(#greenGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />

  <!-- "M" -->
  <path d="M256 322 L256 296 L275 314 L294 296 L294 322" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M214 310 L238 310" stroke="#22c55e" stroke-width="6" stroke-linecap="round" />
</svg>
